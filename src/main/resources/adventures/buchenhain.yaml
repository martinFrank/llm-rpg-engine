dialogs:
- id: dialog.auftrag-des-ortsvorstehers
  topic: Auftrag des Ortsvorstehers
  summary: "dieser Dialog beschreibt den Auftrag, den der Dorfvorsteher den Helden\
    \ am Anfang des Abenteuers gibt."
  context: |-
    Wenn die Helden über den Auftrag reden wird der Dorfvorsteher erzählen, dass über Nacht grauenhaft mutierte Tiere um das Dorf schleichen. Der Dorfvorsteher möchte, dass ihr herausfindet, wieso die Monster das Dorf angreifen und bittet euch, die Bedrohung zu beenden.

    Wenn die Helden fragen, welche Monster das Dorf bedrohen, erfahren die Helden, dass Wölfe, gross wie Rinder, mit glühenden Augen, Füchse, deren Rufe einem das Blut in den Adern gefrieren lassen, Raben grösser und schwärzer wie alles was man kennt, mit rot leuchtenden Augen das Dorf bedrohen. hier darf auch noch ähnliches dazu erfunden werden.

    Wenn die Helden fragen wo die Monster her kommen, so erfahren sie, dass man am abend beobachten kann, dass die Monster aus dem Buchenwald kommen. Keiner weiss, warum sie das machen.
  knowledgeTriggers:
  - trigger.bedrohung-fuer-das-dorf
  - trigger.auftrag-erhalten
- id: dialog.gefahr-fuer-das-dorf
  topic: Gefahr für das Dorf
  summary: "dieser Dialog beschreibt die Gefahr, in der sich das Dorf Buchenhain befindet"
  context: |
    Wenn die Helden über die Gefahr für das Dorf reden, wird ihnen erzählt, dass über Nacht grauenhaft mutierte Tiere um das Dorf schleichen. Die Monster sind Wölfe, gross wie Rinder, mit glühenden Augen, Füchse, deren Rufe einem das Blut in den Adern gefrieren lassen, Raben grösser und schwärzer wie alles was man kennt, mit rot leuchtenden Augen das Dorf bedrohen. Hier darf auch noch ähnliches dazu erfunden werden.

    Wenn die Helden fragen wo die Monster her kommen, so erfahren sie, dass man am abend beobachten kann, dass die Monster aus dem Buchenwald kommen. Keiner weiss, warum sie das machen.
  knowledgeTriggers:
  - trigger.bedrohung-fuer-das-dorf
- id: dialog.weg-zum-buchenwald
  topic: Weg zum Buchenwald
  summary: dieser Dialog beschreibt den Weg zum Buchenwald
  context: |-
    Wenn die Helden über die den Weg zum Buchenwald reden, wird ihnen erzählt, dass über der Weg dahin über das Blumental führt. Im Blumental gibt es Wegweiser, der zum Buchenwald zeigt.

    Wenn die Helden fragen ob es noch weitere Orte im auf dem Weg gibt, so wird ihnen erzählt, dass der Wegweiser im Blumental auch noch zum Steinbruch und zum Pferdebauer führt.
  knowledgeTriggers:
  - trigger.weg-zum-buchenwald
