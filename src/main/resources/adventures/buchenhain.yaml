- id: chapter.ursache-der-probleme
  name: Ursache der Probleme
  summary: |
    Die Helden sollen das Grab des Druiden Gunver Eichblatt finden. Wenn es finden wird sein Geist erscheinen und den Helden erklären, warum die Tiere das Dorf angreifen. Die Tiere sind erbost, weil sein Schutzzauber nicht mehr wirkt und die Tiere für das Böse anfällig werden. Der Zauber wirkt nicht mehr, weil das Horn von Silana gestohlen wurde, ein magisches Artefakt, das für den Zauber verwendet wurde.

    Er erklärt den Helden, dass sie das Horn zurück bringen sollen. Danach müssen sie das Ritual der Erneuerung durchführen, das seinen Geist zur Ruhe bettet und den Schutzzauber erneuert.
  intro:
    intro: |
      Kapitel 2; Die Suche nach der Ursache - Ihr habt also von Ulf Stetten den Auftrag erhalten, herauszufinden warum die wilden Tiere das Dorf bedrohen, und bestenfalls auch noch die Ursache zu unterbinden.
    startLocation: null
    startTime: null
