spring:
  application:
    name: llm-rpg-engine

  web:
    resources:
      # The source tree first, so an edit to the editor's html/css/js is live on the next reload
      # instead of after a rebuild - static resources otherwise come from target/classes, which is
      # a copy made at build time. The classpath entry is what a built jar uses; a location that
      # does not exist is skipped, so the same setting works in both cases.
      static-locations: file:src/main/resources/static/,classpath:/static/

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://192.168.0.251:11434}
      chat:
        options:
          model: "${OLLAMA_MODEL:qwen2.5:14b}"
          temperature: 0.8

# Application-specific tuning for the three agents.
# Available models on the server can be listed via: GET {base-url}/api/tags
rpg:
  adventure:
    # The file the editor reads and writes. Unset means the packaged adventure below is opened
    # read only - which is what a built jar gets, since a resource inside it cannot be written.
    # While writing an adventure, point this at the file in the source tree, so that a save lands
    # in the working copy and goes through git like any other change:
    #   file: src/main/resources/adventures/buchenhain.yaml
    file: ${ADVENTURE_FILE:src/main/resources/adventures/buchenhain.yaml}
    resource: ${ADVENTURE_RESOURCE:adventures/buchenhain.yaml}

  # Context window (num_ctx), covering prompt AND generated response. When it runs out
  # mid-answer the response is simply cut off, which for the structured agents means
  # unparseable JSON ("expected close marker for Object").
  # Deliberately ONE shared value for all agents: Ollama identifies a loaded model by its
  # runner options, so giving the same model a different num_ctx per agent (narrator and
  # talk share one model) forces a reload on every switch and defeats keep-alive.
  # Costs VRAM for the KV cache, so raise in steps and watch the host.
  num-ctx: ${NUM_CTX:16384}
  verdict:
    # Rules engine: pure classification + id-copying, so a smaller/faster model is enough.
    # Low temperature for reliable structured JSON (Verdict).
    # Alternatives: qwen2.5:14b (slower, higher quality), qwen2.5:3b-instruct (even faster).
    #model: "${VERDICT_MODEL:qwen2.5:7b-instruct}"
    model: "${VERDICT_MODEL:qwen2.5:14b-instruct}"
    temperature: 0.3
    # A Verdict is a handful of short fields; anything longer is a runaway.
    num-predict: 400
  narrator:
    # Creative German prose, higher temperature.
    # Alternatives: gemma4:26b, qwen3.5:27b, llama4:latest.
#    model: "${NARRATOR_MODEL:qwen2.5:14b}"
    model: "${NARRATOR_MODEL:Mistral-Small:latest}"
    temperature: 0.9
    # Longest output of the three: several paragraphs of scene description.
    num-predict: 1200
  talk:
    # In-character NPC dialogue: creative but must stay faithful to the scripted
    # dialog instructions, so a moderate temperature.
#    model: "${TALK_MODEL:qwen2.5:14b}"
    model: "${TALK_MODEL:Mistral-Small:latest}"
    temperature: 0.8
    # The prompt asks for one to four sentences (~150 tokens) plus the trigger list;
    # 800 leaves ample room, so hitting this bound means the model went off the rails.
    num-predict: 800

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    # Logs every prompt sent to Ollama and every response received (SimpleLoggerAdvisor).
    # Set to INFO to silence the LLM traffic, DEBUG to see it.
    org.springframework.ai.chat.client.advisor: INFO
    com.github.martinfrank.elitegames.llmrpgengine: DEBUG
